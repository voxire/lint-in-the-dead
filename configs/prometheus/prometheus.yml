global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]
    metrics_path: /metrics

  - job_name: policy-engine
    static_configs:
      - targets: ["policy-engine:8081"]
    metrics_path: /metrics

  - job_name: analysis-service
    static_configs:
      - targets: ["analysis-service:8082"]
    metrics_path: /metrics

  - job_name: audit-service
    static_configs:
      - targets: ["audit-service:8083"]
    metrics_path: /metrics

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8084"]
    metrics_path: /metrics
